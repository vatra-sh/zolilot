name: zolilot

# Zolilöt AG, a fictional company site (class inside joke) at https://zolilöt.vatra.sh
# (punycode xn--zolilt-0xa.vatra.sh). PUBLIC, no Authentik: classmates open the link.
# No data, no secrets, no outbound calls. noindex (meta + Caddy header): it names real people.

services:
  zolilot-app:
    build: ./app
    container_name: zolilot-app
    restart: unless-stopped
    init: true
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /app/.next/cache:size=32m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      TZ: Europe/Zurich
    networks:
      - edge

networks:
  # Caddy reaches the app here; no host ports
  edge:
    external: true
